# Garde-fous avant fusion : types, lint et les deux suites de tests.
#
# Ce workflow **ne déploie rien**. La publication reste une décision explicite :
# un commit vert ne met pas la production à jour.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests de rendu (smoke)
        run: npm run test:smoke

      - name: Tests du Worker
        run: npm run test:worker
